<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png">
  <link rel="stylesheet" href="./styles.css">
  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
    crossorigin=""
  >
  <title>IP Address Tracker</title>
</head>
<body>
  <main>
    <section class="tracker" aria-labelledby="page-title">
      <h1 id="page-title">IP Address Tracker</h1>

      <form class="search-form" id="search-form">
        <label class="visually-hidden" for="ip-address">Search for any IP address or domain</label>
        <input
          id="ip-address"
          name="ip-address"
          type="text"
          placeholder="Search for any IP address or domain"
          autocomplete="off"
        >
        <button type="submit" aria-label="Search">
          <img src="./images/icon-arrow.svg" alt="">
        </button>
      </form>
      <p class="status-message" id="status-message" role="status" aria-live="polite"></p>

      <section class="ip-details" aria-label="IP address information">
        <dl>
          <div class="detail">
            <dt>IP Address</dt>
            <dd id="ip-result">192.212.174.101</dd>
          </div>
          <div class="detail">
            <dt>Location</dt>
            <dd id="location-result">Brooklyn, NY 10001</dd>
          </div>
          <div class="detail">
            <dt>Timezone</dt>
            <dd id="timezone-result">UTC -05:00</dd>
          </div>
          <div class="detail">
            <dt>ISP</dt>
            <dd id="isp-result">SpaceX Starlink</dd>
          </div>
        </dl>
      </section>
    </section>

    <section class="map" id="map" aria-label="Map showing the IP address location">
    </section>
  </main>
  <script
    src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
    integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
    crossorigin=""
  ></script>
  <script src="./ip.js"></script>
</body>
</html>
