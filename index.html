<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta
    name="description"
    content="Look up an IP address or domain to see its location, timezone, ISP, and map."
  >
  <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png">
  <link rel="stylesheet" href="./styles.css">
  <!-- Leaflet's stylesheet formats the interactive map. -->
  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
    crossorigin=""
  >
  <title>IP Address Tracker</title>
</head>
<body>
  <main>
    <section class="tracker" aria-labelledby="page-title">
      <h1 id="page-title">IP Address Tracker</h1>

      <form class="search-form" id="search-form">
        <label class="visually-hidden" for="ip-address">Search for any IP address or domain</label>
        <input
          id="ip-address"
          name="ip-address"
          type="search"
          placeholder="Search for any IP address or domain"
          autocomplete="off"
          aria-describedby="status-message"
        >
        <button type="submit" aria-label="Search">
          <img src="./images/icon-arrow.svg" alt="">
        </button>
      </form>
      <p class="status-message" id="status-message" role="status" aria-live="polite"></p>

      <section
        class="ip-details"
        aria-label="IP address information"
        aria-live="polite"
        aria-atomic="true"
      >
        <div class="details-grid">
          <div class="detail">
            <h2 class="detail-label">IP Address</h2>
            <p class="detail-value" id="ip-result">192.212.174.101</p>
          </div>
          <div class="detail">
            <h2 class="detail-label">Location</h2>
            <p class="detail-value" id="location-result">Brooklyn, NY 10001</p>
          </div>
          <div class="detail">
            <h2 class="detail-label">Timezone</h2>
            <p class="detail-value" id="timezone-result">UTC -05:00</p>
          </div>
          <div class="detail">
            <h2 class="detail-label">ISP</h2>
            <p class="detail-value" id="isp-result">SpaceX Starlink</p>
          </div>
        </div>
      </section>
    </section>

    <section class="map" id="map" aria-label="Map showing the IP address location">
    </section>
  </main>
  <script
    src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
    integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
    crossorigin=""
  ></script>
  <script src="./ip.js"></script>
</body>
</html>
